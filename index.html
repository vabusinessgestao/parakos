function localizarColunaResponsavel(colunas){
  return (colunas||[]).find(c => c.tipo==='select' && normalizarBusca(c.nome)==='responsavel');
}
function localizarColunaFranquia(colunas){
  return (colunas||[]).find(c => c.tipo==='select' && normalizarBusca(c.nome)==='franquia');
}
// as opções de "Responsável" não vêm mais de uma lista de texto livre: são os
// funcionários (colaboradores + gerentes) de verdade cadastrados naquela Franquia
function opcoesResponsavelParaFranquia(franquia){
  const lista = (estado.funcionarios||[]).filter(f=> franquia ? f.franquia===franquia : true);
  return lista.map(f=>f.usuario).sort((a,b)=>a.localeCompare(b,'pt-BR'));
}

function campoFormulario(coluna, valorAtual, indice, todasColunas, somenteLeitura){
  const id = 'campo_'+indice;
  const rotulo = escapeHtml(coluna.nome);
  const desabilitado = somenteLeitura ? 'disabled' : '';
  if(coluna.tipo==='select'){
    const chaveCampo = normalizarBusca(coluna.nome);
    const atributoExtra = chaveCampo==='franquia' ? `onchange="app.aoTrocarFranquiaNoFormulario(this.value)"` : '';
    const marcador = chaveCampo==='responsavel' ? `data-campo-responsavel="1"` : '';
    return `<label>${rotulo}
      <select id="${id}" ${desabilitado} ${atributoExtra} ${marcador}>
        <option value="">— selecione —</option>
        ${coluna.opcoes.map(op=>`<option value="${escapeHtml(op)}" ${op===valorAtual?'selected':''}>${escapeHtml(op)}</option>`).join('')}
      </select>
    </label>`;
  }
  if(coluna.tipo==='numero') return `<label>${rotulo}<input type="number" step="any" id="${id}" value="${escapeHtml(valorAtual)}" ${desabilitado}></label>`;
  if(coluna.tipo==='data') return `<label>${rotulo}<input type="text" id="${id}" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" value="${escapeHtml(formatarDataBR(valorAtual))}" oninput="app.mascararData(this)" ${desabilitado}></label>`;
  if(coluna.tipo==='texto_longo'){
    const podeEditarTextoLivre = estado.papel === 'admin' || estado.papel === 'gerente';
    return `<label>${rotulo}
        <textarea id="${id}" rows="6" class="${podeEditarTextoLivre?'':'textarea-somente-leitura'}" ${podeEditarTextoLivre?'':'readonly'} placeholder="${podeEditarTextoLivre?'Histórico de ações — você pode editar livremente aqui.':'O histórico aparece aqui — use os campos abaixo para adicionar uma nova ação.'}">${escapeHtml(valorAtual||'')}</textarea>
      </label>
      <label style="margin-top:-6px">Nova ação
        <textarea id="${id}_novaEntrada" rows="4" placeholder="Nova ação realizada agora… (pode escrever em várias linhas, usar marcadores etc.)"></textarea>
      </label>
      <div class="ferramenta-historico">
        <input type="text" id="${id}_comissaoEntrada" placeholder="Equipe — nomes das pessoas envolvidas nesta ação (opcional)">
        <button type="button" class="botao-secundario" onclick="app.adicionarEntradaHistorico('${id}')">+ Adicionar ao histórico</button>
      </div>`;
  }
  return `<label>${rotulo}<input type="text" id="${id}" value="${escapeHtml(valorAtual||'')}" ${desabilitado}></label>`;
}

function viewModal(){
  const { aba, id, registroAtual } = estado.modal;
  const infoAba = estado.schema.find(a=>a.nome===aba);
  const campos = infoAba.colunas.filter(c=>!c.ehId);
  const somenteAcao = !!id && estado.papel !== 'admin' && estado.papel !== 'gerente'; // colaborador editando um registro existente: só pode acrescentar ação
  const colunaResponsavel = localizarColunaResponsavel(campos);
  const colunaFranquia = localizarColunaFranquia(campos);
  // Franquia usada para calcular as opções de Responsável no primeiro render:
  // registro existente > Franquia travada do usuário > o que já estiver selecionado
  const franquiaDeReferencia = registroAtual ? registroAtual['Franquia'] : (estado.franquia || '');
  return `
    <div class="sobreposicao" onclick="app.fecharModalSeClicarFora(event)">
      <div class="modal-caixa">
        <h3>${id ? 'Editar registro' : 'Novo registro'}</h3>
        <p class="subtitulo" style="margin-bottom:0">${escapeHtml(aba)}</p>
        ${somenteAcao ? `<div class="aviso-discreto" style="margin-top:12px">Como colaborador, você só pode acrescentar uma nova ação. Os demais campos estão bloqueados.</div>` : ''}
        ${(estado.franquia && colunaFranquia) ? `<div class="aviso-discreto" style="margin-top:12px">Você está vinculado à Franquia <strong>${escapeHtml(estado.franquia)}</strong> — esse campo fica travado nesse valor.</div>` : ''}
        ${(estado.papel==='colaborador' && colunaResponsavel) ? `<div class="aviso-discreto" style="margin-top:12px">Como colaborador, o campo Responsável fica travado em você mesmo — você só vê e gerencia os próprios acompanhamentos.</div>` : ''}
        <form onsubmit="app.salvarRegistro(event)">
          ${campos.map((c,i)=>{
            const travadoPorFranquia = !!(estado.franquia && colunaFranquia && c===colunaFranquia);
            const travadoPorResponsavel = !!(estado.papel==='colaborador' && colunaResponsavel && c===colunaResponsavel);
            const desabilitar = (somenteAcao && c.tipo!=='texto_longo') || travadoPorFranquia || travadoPorResponsavel;
            let valorAtual;
            if(registroAtual) valorAtual = registroAtual[c.nome];
            else if(travadoPorFranquia) valorAtual = estado.franquia;
            else if(travadoPorResponsavel) valorAtual = estado.usuario;
            else valorAtual = '';
            // Responsável: opções vêm dos funcionários de verdade da Franquia em questão, não da lista livre
            const colunaParaRenderizar = (c===colunaResponsavel)
              ? Object.assign({}, c, { opcoes: opcoesResponsavelParaFranquia(franquiaDeReferencia) })
              : c;
            return campoFormulario(colunaParaRenderizar, valorAtual, i, campos, desabilitar);
          }).join('')}
          ${estado.enviando ? barraProgresso() : ''}
          <div class="acoes-modal">
            <button type="button" class="botao-secundario" onclick="app.fecharModal()" ${estado.enviando?'disabled':''}>Cancelar</button>
            <button type="submit" class="botao-primario" ${estado.enviando?'disabled':''}>${estado.enviando?'Salvando…':'Salvar'}</button>
          </div>
        </form>
      </div>
    </div>`;
}

      <p class="subtitulo" style="margin:0 0 14px">Adicione ou remova as opções que aparecem nos menus suspensos.</p>
      <div class="abas-config">
        ${CATEGORIAS_OPCOES.map(c=>`<button class="aba-config ${categoriaAtual===c.chave?'ativa':''}" onclick="app.selecionarCategoriaConfig('${c.chave}')">${escapeHtml(c.rotulo)}</button>`).join('')}

      <form class="form-nova-opcao" onsubmit="app.adicionarOpcaoConfig(event)">

    </div>

    <div class="cartao-config">
      <h3>Campos personalizados</h3>
      <p class="subtitulo" style="margin:0 0 14px">Crie campos novos (lista, texto, número ou data) para o formulário do Acompanhamento. Os 5 campos padrão do sistema não podem ser removidos.</p>
      <div class="lista-campos-config">
        ${campos.length===0 ? '<p class="vazio-inline">Nenhum campo personalizado ainda.</p>' : campos.map(c=>`
          <div class="linha-campo-config">
            <span class="nome-campo-config">${escapeHtml(c.nome)}</span>
            <span class="tipo-campo-config">${escapeHtml(rotuloTipoCampo(c.tipo))}${c.tipo==='select' ? ` (${(c.opcoes||[]).length} opções)` : ''}</span>
            <button type="button" class="botao-icone perigo" title="Excluir campo" onclick="app.excluirCampoConfig(${c.id}, '${escapeHtml(c.nome)}')">🗑</button>
          </div>`).join('')}
      </div>
      <button type="button" class="botao-primario" style="margin-top:12px" onclick="app.abrirNovoCampo()">+ Novo campo</button>
    </div>
    ` : ''}

    <div class="cartao-config">
      <h3>${ehAdmin ? 'Usuários' : 'Colaboradores da minha Franquia'}</h3>
      <p class="subtitulo" style="margin:0 0 14px">${ehAdmin ? 'Crie acessos para novas pessoas usarem o painel, com papel de admin, gerente ou colaborador.' : `Gerencie os colaboradores da Franquia ${escapeHtml(estado.franquia||'')}.`}</p>
      <div class="lista-campos-config">
        ${usuarios.length===0 ? '<p class="vazio-inline">Nenhum usuário encontrado.</p>' : usuarios.map(u=>`
          <div class="linha-campo-config">
            <span class="nome-campo-config">${escapeHtml(u.usuario)}</span>
            <span class="tipo-campo-config"><span class="cracha cracha-${escapeHtml(u.papel)}">${escapeHtml(u.papel)}</span> ${u.franquia ? `<span class="cracha">${escapeHtml(u.franquia)}</span>` : '<span class="vazio-inline" style="font-size:12px">Todas as Franquias</span>'}</span>
            <button type="button" class="botao-icone" title="Editar usuário" onclick="app.abrirEditarUsuario('${escapeHtml(u.usuario)}')">✎</button>
            <button type="button" class="botao-icone perigo" title="Excluir usuário" ${u.usuario===estado.usuario?'disabled':''} onclick="app.excluirUsuarioConfig('${escapeHtml(u.usuario)}')">🗑</button>
          </div>`).join('')}
      </div>
      <button type="button" class="botao-primario" style="margin-top:12px" onclick="app.abrirNovoUsuario()">+ Novo ${ehAdmin ? 'usuário' : 'colaborador'}</button>
    </div>
  `;
}

  return { select:'Lista de opções', texto:'Texto', texto_longo:'Texto longo', numero:'Número', data:'Data' }[tipo] || tipo;
}

/* ============================================================================
   AÇÕES DO PAINEL (chamadas pelos onclick/onsubmit no HTML acima)
   ========================================================================== */
const app = {
  async entrar(e){
    e.preventDefault();
    const usuario = document.getElementById('campoUsuario').value.trim();
    const senha = document.getElementById('campoSenha').value;
    estado.enviando = true;
    estado.erroLogin = null;
    renderizar();
    const resp = await apiCall('login', { usuario, senha });
    if(resp.ok){
      estado.usuario = resp.usuario;
      estado.papel = resp.papel;
      estado.franquia = resp.franquia || null;
      estado.erroLogin = null;
      const [respSchema, respFuncionarios] = await Promise.all([apiCall('schema', {}), apiCall('listarFuncionarios', {})]);
      estado.enviando = false;
      if(respSchema.ok){
        estado.schema = respSchema.abas;
        estado.funcionarios = respFuncionarios.ok ? respFuncionarios.funcionarios : [];
        estado.abaAtiva = 'calendario';
        salvarSessao(estado.usuario, estado.papel, estado.franquia);
        renderizar();
        app.atualizarDados();
      } else {
        estado.erroLogin = 'Não foi possível carregar a estrutura da planilha: ' + (respSchema.erro||'');
        estado.usuario = null; estado.papel = null; estado.franquia = null;
        renderizar();
      }
    } else {
      estado.enviando = false;
      estado.erroLogin = resp.erro || 'Não foi possível entrar.';
      renderizar();
    }
  },

  sair(){
    if(estado.timerAuto) clearInterval(estado.timerAuto);
    limparSessaoSalva();
    const { logomarca, coresTema, coresSituacao } = estado; // identidade visual não é da sessão: mantém na tela de login
    estado = estadoInicial();
    estado.logomarca = logomarca;
    estado.coresTema = coresTema;
    estado.coresSituacao = coresSituacao;
    renderizar();
  },

  selecionarAba(nome){
    estado.abaAtiva = nome;
    estado.filtro = '';
    estado.filtrosColuna = {};
    estado.erroAtualizacao = null;
    renderizar();
    app.atualizarDados();
  },

  filtrarTabela(valor){
    estado.filtro = valor;
    const posicaoCursor = valor.length;
    renderizar();
    const campoBusca = document.getElementById('buscaTabela');
    if(campoBusca){
      campoBusca.focus();
      campoBusca.setSelectionRange(posicaoCursor, posicaoCursor);
    }
  },

  filtrarPorColuna(nomeColuna, valor){
    estado.filtrosColuna = { ...estado.filtrosColuna, [nomeColuna]: valor };
    renderizar();
  },

  limparFiltrosColuna(){
    estado.filtrosColuna = {};
    renderizar();
  },

  alternarExpandir(id){
    if(estado.expandidos.has(id)) estado.expandidos.delete(id);
    else estado.expandidos.add(id);
    renderizar();
  },

  mudarMesCalendario(delta){
    garantirMesCalendario();
    let novoMes = estado.calendarioMes + delta;
    let novoAno = estado.calendarioAno;
    if(novoMes<1){ novoMes = 12; novoAno--; }
    else if(novoMes>12){ novoMes = 1; novoAno++; }
    estado.calendarioMes = novoMes;
    estado.calendarioAno = novoAno;
    renderizar();
  },
  abrirDiaCalendario(chave){
    estado.calendarioDiaSelecionado = chave;
    renderizar();
  },
  fecharDiaCalendario(){
    estado.calendarioDiaSelecionado = null;
    renderizar();
  },
  fecharModalSeClicarForaDiaCalendario(e){
    if(e.target.classList.contains('sobreposicao')) app.fecharDiaCalendario();
  },
  mudarVisualizacaoCalendario(modo){
    estado.calendarioVisualizacao = modo;
    renderizar();
  },
  mudarAnoCalendario(delta){
    garantirMesCalendario();
    estado.calendarioAno += delta;
    renderizar();
  },
  mudarSemanaCalendario(delta){
    const d = obterDataReferenciaCalendario();
    d.setDate(d.getDate() + delta*7);
    definirReferenciaCalendario(d);
    renderizar();
  },
  mudarDiaCalendario(delta){
    const d = obterDataReferenciaCalendario();
    d.setDate(d.getDate() + delta);
    definirReferenciaCalendario(d);
    renderizar();
  },
  irParaDiaCalendario(ano, mes, dia){
    estado.calendarioAno = ano;
    estado.calendarioMes = mes;
    estado.calendarioDiaRef = dia;
    estado.calendarioVisualizacao = 'diario';
    renderizar();
  },
  enviarBlocoWhatsApp(botao){
    const texto = botao.getAttribute('data-texto');
    window.open('https://wa.me/?text=' + texto, '_blank');
  },
  enviarBlocoEmail(botao){
    const assunto = botao.getAttribute('data-assunto');
    const corpo = botao.getAttribute('data-corpo');
    window.location.href = 'mailto:?subject=' + assunto + '&body=' + corpo;
  },

  async atualizarDados(){
    estado.carregando = true;
    renderizar();
    try{
      if(estado.abaAtiva === 'dashboard'){
        const resp = await apiCall('dashboard', { usuarioFranquia: estado.franquia, usuarioResponsavelRestrito: estado.papel==='colaborador' ? estado.usuario : null });
        if(!resp.ok) throw new Error(resp.erro || 'Falha ao buscar indicadores.');
        estado.painel = resp.painel;
      } else {
        // calendário usa os mesmos dados da aba principal de acompanhamento
        const nomeAbaParaBuscar = estado.abaAtiva==='calendario'
          ? ((estado.schema && estado.schema[0]) ? estado.schema[0].nome : 'Acompanhamento')
          : estado.abaAtiva;
        const resp = await apiCall('listar', { aba: nomeAbaParaBuscar, usuarioFranquia: estado.franquia, usuarioResponsavelRestrito: estado.papel==='colaborador' ? estado.usuario : null });
        if(!resp.ok) throw new Error(resp.erro || 'Falha ao buscar dados.');
        estado.cache[nomeAbaParaBuscar] = resp.registros;
      }
      estado.ultimaAtualizacao = new Date();
      estado.erroAtualizacao = null;
    } catch(err){
      estado.erroAtualizacao = 'Não foi possível atualizar agora. Mostrando os últimos dados carregados.';
    } finally {
      estado.carregando = false;
      renderizar();
    }
  },

  toggleAutoAtualizar(){
    estado.autoAtualizar = !estado.autoAtualizar;
    if(estado.autoAtualizar){
      estado.timerAuto = setInterval(()=>app.atualizarDados(), estado.intervaloMin*60*1000);
    } else if(estado.timerAuto){
      clearInterval(estado.timerAuto);
      estado.timerAuto = null;
    }
    renderizar();
  },

  mudarIntervalo(min){
    estado.intervaloMin = Number(min);
    if(estado.autoAtualizar && estado.timerAuto){
      clearInterval(estado.timerAuto);
      estado.timerAuto = setInterval(()=>app.atualizarDados(), estado.intervaloMin*60*1000);
    }
  },

  abrirNovo(aba){
    estado.modal = { aba, id:null, registroAtual:null };
    renderizar();
  },
  abrirEditar(aba, id){
    const registro = (estado.cache[aba]||[]).find(r=>String(r.ID)===String(id));
    estado.modal = { aba, id, registroAtual: registro };
    renderizar();
  },
  fecharModal(){ estado.modal = null; renderizar(); },
  fecharModalSeClicarFora(e){ if(e.target.classList.contains('sobreposicao')) app.fecharModal(); },

  adicionarEntradaHistorico(idCampo){
    const campoNovaEntrada = document.getElementById(idCampo+'_novaEntrada');
    const areaTexto = document.getElementById(idCampo);
    const campoComissao = document.getElementById(idCampo+'_comissaoEntrada');
    const texto = campoNovaEntrada.value.trim();
    if(!texto) { campoNovaEntrada.focus(); return; }
    const agora = new Date();
    const dataHora = agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
    const equipe = campoComissao ? campoComissao.value.trim() : '';
    const linhasBloco = [`[${dataHora}]`, texto, `Lançado por: ${estado.usuario}`];
    if(equipe) linhasBloco.push(`Equipe: ${equipe}`);
    const blocoNovo = linhasBloco.join('\n');
    areaTexto.value = areaTexto.value ? (areaTexto.value + '\n\n' + blocoNovo) : blocoNovo;
    campoNovaEntrada.value = '';
    if(campoComissao) campoComissao.value = '';
    areaTexto.scrollTop = areaTexto.scrollHeight;
    campoNovaEntrada.focus();
  },

  mascararData(el){
    const digitos = el.value.replace(/\D/g,'').slice(0,8);
    let formatado = digitos;
    if(digitos.length > 4) formatado = digitos.slice(0,2)+'/'+digitos.slice(2,4)+'/'+digitos.slice(4);
    else if(digitos.length > 2) formatado = digitos.slice(0,2)+'/'+digitos.slice(2);
    el.value = formatado;
  },

  // quando o admin/gerente muda a Franquia no formulário de registro, atualiza
  // as opções do campo Responsável na hora (só mostra funcionários daquela Franquia)
  aoTrocarFranquiaNoFormulario(novaFranquia){
    const selectResponsavel = document.querySelector('[data-campo-responsavel]');
    if(!selectResponsavel) return;
    const valorAtualResp = selectResponsavel.value;
    const opcoes = opcoesResponsavelParaFranquia(novaFranquia);
    selectResponsavel.innerHTML = '<option value="">— selecione —</option>' +
      opcoes.map(op=>`<option value="${escapeHtml(op)}" ${op===valorAtualResp?'selected':''}>${escapeHtml(op)}</option>`).join('');
  },

  // no formulário de criar/editar USUÁRIO: quando o papel escolhido é Gerente,
  // remove a opção "sem restrição" da Franquia — Gerente é sempre restrito
  aoTrocarPapelNoFormularioUsuario(novoPapel, idSelectFranquia){
    const selectFranquia = document.getElementById(idSelectFranquia);
    if(!selectFranquia) return;
    const opcaoSemRestricao = selectFranquia.querySelector('option[value=""]');
    if(novoPapel === 'gerente'){
      if(opcaoSemRestricao) opcaoSemRestricao.disabled = true;
      if(!selectFranquia.value){
        const primeiraValida = selectFranquia.querySelector('option[value]:not([value=""])');
        if(primeiraValida) selectFranquia.value = primeiraValida.value;
      }
    } else if(opcaoSemRestricao){
      opcaoSemRestricao.disabled = false;
    }
  },

  async salvarRegistro(e){
    e.preventDefault();
    const { aba, id } = estado.modal;
    const infoAba = estado.schema.find(a=>a.nome===aba);
    const campos = infoAba.colunas.filter(c=>!c.ehId);
    const registro = {};
    campos.forEach((c,i)=>{
      const el = document.getElementById('campo_'+i);
      if(!el) return;
      registro[c.nome] = (c.tipo==='data') ? converterBRparaISO(el.value) : el.value;
    });
    estado.enviando = true;
    renderizar();
    const resp = id
      ? await apiCall('atualizar', { aba, id, registro, usuarioFranquia: estado.franquia, usuarioResponsavelRestrito: estado.papel==='colaborador' ? estado.usuario : null })
      : await apiCall('criar', { aba, registro, usuarioFranquia: estado.franquia, usuarioResponsavelRestrito: estado.papel==='colaborador' ? estado.usuario : null });
    estado.enviando = false;
    if(resp.ok){
      estado.modal = null;
      app.atualizarDados();
    } else {
      renderizar();
      alert('Não foi possível salvar: ' + (resp.erro || 'erro desconhecido.'));
    }
  },

  async excluirRegistro(aba, id){
    if(!confirm('Tem certeza que deseja excluir este registro? Essa ação não pode ser desfeita.')) return;
    const resp = await apiCall('excluir', { aba, id, usuarioFranquia: estado.franquia, usuarioResponsavelRestrito: estado.papel==='colaborador' ? estado.usuario : null });
    if(resp.ok){ app.atualizarDados(); }

  // arrastar-e-soltar do post-it: manipula o DOM diretamente durante o
  // arraste (fluido, sem re-renderizar tudo a cada pixel) e só persiste a
  // posição final no banco quando soltar
  iniciarArrastePostIt(e, id){
    e.preventDefault();
    const elemento = document.querySelector(`.post-it[data-id="${id}"]`);
    if(!elemento) return;
    const evento = e.touches ? e.touches[0] : e;
    const retanguloElemento = elemento.getBoundingClientRect();
    const retanguloQuadro = elemento.parentElement.getBoundingClientRect();
    estado._arraste = {
      id, elemento,
      offsetX: evento.clientX - retanguloElemento.left,
      offsetY: evento.clientY - retanguloElemento.top,
      quadroLeft: retanguloQuadro.left,
      quadroTop: retanguloQuadro.top,
      novoX: null, novoY: null
    };
    document.addEventListener('mousemove', app._moverPostIt);
    document.addEventListener('mouseup', app._soltarPostIt);
    document.addEventListener('touchmove', app._moverPostIt, { passive:false });
    document.addEventListener('touchend', app._soltarPostIt);
  },
  _moverPostIt(e){
    const arraste = estado._arraste;
    if(!arraste) return;
    e.preventDefault();
    const evento = e.touches ? e.touches[0] : e;
    let novoX = evento.clientX - arraste.quadroLeft - arraste.offsetX;
    let novoY = evento.clientY - arraste.quadroTop - arraste.offsetY;
    novoX = Math.max(0, novoX);
    novoY = Math.max(0, novoY);
    arraste.elemento.style.left = novoX + 'px';
    arraste.elemento.style.top = novoY + 'px';
    arraste.novoX = novoX;
    arraste.novoY = novoY;
  },
  async _soltarPostIt(){
    const arraste = estado._arraste;
    document.removeEventListener('mousemove', app._moverPostIt);
    document.removeEventListener('mouseup', app._soltarPostIt);
    document.removeEventListener('touchmove', app._moverPostIt);
    document.removeEventListener('touchend', app._soltarPostIt);
    estado._arraste = null;
    if(!arraste || arraste.novoX===null) return; // só clicou, não arrastou de verdade
    const resp = await apiCall('atualizarPosicaoRecado', { id: arraste.id, posX: arraste.novoX, posY: arraste.novoY, usuarioLogado: estado.usuario });
    if(resp.ok){
      const r = (estado.recados && estado.recados.recebidos || []).find(x=>x.id===arraste.id);
      if(r){ r.pos_x = arraste.novoX; r.pos_y = arraste.novoY; }
    }
  },

   qualquer outra coisa, pra já aparecer certa na primeira tela (login ou
   painel). Depois, se já houver uma sessão salva (usuário logado antes de
   atualizar a página), restaura ela em vez de voltar para a tela de login.
   ========================================================================== */
(async function iniciarApp(){
  const respConfig = await apiCall('configSistema', {});
  if(respConfig.ok){
    estado.logomarca = respConfig.logomarca || null;
    estado.coresTema = respConfig.coresTema || null;
    estado.coresSituacao = respConfig.coresSituacao || null;
  }
  aplicarTemaCores(estado.coresTema);

  const sessaoSalva = lerSessaoSalva();
  if(!sessaoSalva || !sessaoSalva.usuario){
    renderizar();
    return;
  }
  estado.usuario = sessaoSalva.usuario;
  estado.papel = sessaoSalva.papel;
  estado.franquia = sessaoSalva.franquia || null;
  estado.carregando = true;
  renderizar(); // mostra a tela do painel já "logada" enquanto os dados carregam

  // reconfere papel/franquia direto no banco (não confia só no que ficou salvo
  // no navegador) — se um admin/gerente mudou isso enquanto a sessão já estava
  // aberta, essa é a hora de pegar o valor certo, antes de buscar qualquer dado
  const respUsuario = await apiCall('obterUsuario', { usuario: estado.usuario });
  if(respUsuario.ok){
    estado.papel = respUsuario.papel;
    estado.franquia = respUsuario.franquia;
    salvarSessao(estado.usuario, estado.papel, estado.franquia);
  }
  // se falhar (banco fora do ar etc.), segue com o valor salvo localmente
  // em vez de travar o usuário fora do sistema por uma falha de rede

  const [respSchema, respFuncionarios] = await Promise.all([apiCall('schema', {}), apiCall('listarFuncionarios', {})]);
  estado.carregando = false;
  if(respSchema.ok){
    estado.schema = respSchema.abas;
    estado.funcionarios = respFuncionarios.ok ? respFuncionarios.funcionarios : [];
    estado.abaAtiva = 'calendario';
    renderizar();
    app.atualizarDados();
  } else {
    // não foi possível confirmar a sessão (banco fora do ar, etc.) — volta pro login
    limparSessaoSalva();
    const { logomarca, coresTema, coresSituacao } = estado;
    estado = estadoInicial();
    estado.logomarca = logomarca;
    estado.coresTema = coresTema;
    estado.coresSituacao = coresSituacao;
    estado.erroLogin = 'Não foi possível restaurar sua sessão. Entre novamente.';
    renderizar();
  }
})();
</script>
